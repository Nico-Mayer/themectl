schema: spec-driven

context: |
  Designs and tasks must cover macOS, Linux and Windows. State when a change is platform-specific.
  Integrations must never break user config files: preserve comments and formatting, touch only owned keys.
  A failing integration must not stop other integrations from applying.

rules:
  tasks:
    - Each task names how to verify it (test, command or manual check)
    - Include a docs task when user-facing behavior or theme/settings fields change

operations:
  apply:
    guidance:
      - After apply, review the change using the /subagent-review skill
