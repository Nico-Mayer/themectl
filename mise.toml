[tools]
"go:gotest.tools/gotestsum" = "latest"
goreleaser = "latest"
"npm:@fission-ai/openspec" = "latest"
svu = "latest"
hk = { version = "latest", workflow = "release.yml" }

[shell_alias]
mr = "mise run"

[settings]
skills.dir = ".agents/skills"
skills.auto_sync = true

[tasks."."]
description = "Runs the app"
run = "go run ./cmd/themectl"

[tasks.fmt]
description = "Run go fmt"
run = "gofmt -w ."

[tasks.build]
description = "Compile the themectl binary"
run = "go build -o themectl ./cmd/themectl"

[tasks.install]
description = "Builds and installes the app"
depends = ["build"]
run = """
sudo mv -f themectl /usr/local/bin/themectl
themectl completion fish > ~/.config/fish/completions/themectl.fish
"""
run_windows = """
move themectl %USERPROFILE%\\bin\\themectl.exe
"""

[tasks.test]
description = "Run the test suite"
run = "gotestsum ./..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run tests and lint"
depends = ["test", "lint"]

[tasks."release:snapshot"]
description = "Build a local snapshot release with goreleaser"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Tag the next version (derived from conventional commits) and push to trigger the release workflow"
usage = 'arg "[bump]" default="next" help="next|major|minor|patch"'
run = """
set -e
current=$(svu current)
next=$(svu "$usage_bump")
if [ "$next" = "$current" ]; then
  echo "nothing to release since $current" >&2
  exit 1
fi
echo "releasing $current -> $next"
git tag -m "$next" "$next"
git push origin "$next"
"""

[tasks."schema:gen"]
description = "Generate JSON schemas from Go structs"
alias = "gen"
run = "go generate ./..."

[tasks."schema:check"]
description = "Regenerate JSON schemas and fail on drift"
depends = ["schema:gen"]
run = "git diff --exit-code schemas/"

[tasks."skills:mise"]
description = "Sync mise skills"
hide = true
run = [
  "mise skills sync",
  "mise skills sync --dir .claude/skills",
]

[tasks."skills:skillshare"]
description = "Sync skillshare skills"
run = [
  "skillshare install -p",
  "skillshare sync -p",
]

[tasks."skills:openspec"]
description = "Sync openspec skills"
hide = true
run = [
  "openspec init --tools claude",
  "openspec init --tools agents",
]

[tasks."skills:sync"]
description = "Sync all skills"
# Sequential: subtasks write to the same skill dirs
run = [
  { task = "skills:mise" },
  { task = "skills:skillshare" },
  { task = "skills:openspec" },
]

[hooks]
postinstall = [
  "mise run skills:sync",
  "hk install",
]
